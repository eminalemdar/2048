apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: game2048-application
  namespace: kro
spec:
  schema:
    apiVersion: v1alpha1
    kind: Game2048Application
    spec:
      # Application configuration
      name: string | default="game2048"
      namespace: string | default="game-2048"

      # Backend configuration
      backendImage: string | default="emnalmdr/2048-backend:v9"
      backendReplicas: integer | default=2
      backendPort: integer | default=8000

      # Frontend configuration.
      # frontendPort is the container port: the unprivileged nginx image runs
      # as uid 101 and cannot bind anything below 1024. Callers still reach the
      # Service on frontendServicePort.
      frontendImage: string | default="emnalmdr/2048-frontend:v9"
      frontendReplicas: integer | default=2
      frontendPort: integer | default=8080
      frontendServicePort: integer | default=80

      # DynamoDB configuration.
      # Defaults match the tables the IAM role grants access to — a mismatch
      # here surfaces as AccessDenied at runtime, not at deploy time.
      tableName: string | default="game2048-leaderboard-dev"
      sessionsTableName: string | default="game2048-sessions-dev"
      # Bucket holding the leaderboard backup snapshot. Must match the bucket
      # the backend IAM role is granted access to.
      backupBucketName: string | default="game2048-backup-dev-unique-12345"
      region: string | default="eu-west-1"

      # AWS account hosting the backend's IAM role. Required, with no default.
      accountId: string
      backendRoleName: string | default="game2048-backend-role"

      # Ingress configuration.
      #
      # ⚠️ `hostname` is INERT — no template below references it. The Ingress
      # emits no host rule on purpose: an internet-facing ALB is reached through
      # its own generated DNS name, the same decision documented in
      # kubernetes/ingress.yaml. It survives the migration that removed the
      # `host: 2048.local` rule.
      #
      # It cannot simply be deleted. kro guards published CRDs against breaking
      # schema changes and rejects the update:
      #
      #   cannot update CRD game2048applications.kro.run:
      #   breaking changes detected: Property hostname was removed
      #
      # The RGD then goes Inactive (KindReady=False) while the graph itself
      # still compiles. Dropping it therefore means deleting and recreating the
      # RGD, which takes every instance and all their resources with it — too
      # destructive for a cosmetic field. Remove it at the next intentional
      # teardown, and until then do not read any meaning into its value.
      hostname: string | default="2048.local"
      ingressClass: string | default="alb"

  resources:
    # Namespace
    - id: appNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}
            app.kubernetes.io/managed-by: kro

    # Backend Service Account
    - id: backendServiceAccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.name}-backend
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-backend
            app.kubernetes.io/component: backend
            app.kubernetes.io/managed-by: kro
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::${schema.spec.accountId}:role/${schema.spec.backendRoleName}

    # Backend Deployment
    - id: backendDeployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-backend
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-backend
            app.kubernetes.io/component: backend
            app.kubernetes.io/managed-by: kro
        spec:
          replicas: ${schema.spec.backendReplicas}
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}-backend
              app.kubernetes.io/component: backend
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.spec.name}-backend
                app.kubernetes.io/component: backend
            spec:
              serviceAccountName: ${schema.spec.name}-backend
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: backend
                  image: ${schema.spec.backendImage}
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
                  ports:
                    - containerPort: ${schema.spec.backendPort}
                      name: http
                  env:
                    - name: PORT
                      value: "8000"
                    - name: AWS_REGION
                      value: ${schema.spec.region}
                    - name: DYNAMODB_TABLE
                      value: ${schema.spec.tableName}
                    - name: GAME_SESSIONS_TABLE
                      value: ${schema.spec.sessionsTableName}
                    # Explicitly empty: the ALB serves the frontend and the API
                    # from one origin, so no CORS headers are needed. Leaving
                    # this unset would fall back to "*" and allow any site to
                    # call the API from a browser.
                    - name: CORS_ALLOWED_ORIGINS
                      value: ""
                    # S3 backup: a JSON snapshot of the leaderboard is written
                    # after every accepted score, and read back if DynamoDB is
                    # unreachable. Both variables are required to enable it.
                    - name: S3_ENABLED
                      value: "true"
                    - name: S3_BUCKET
                      value: ${schema.spec.backupBucketName}
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "128Mi"
                      cpu: "100m"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: ${schema.spec.backendPort}
                    initialDelaySeconds: 10
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: ${schema.spec.backendPort}
                    initialDelaySeconds: 5
                    periodSeconds: 10

    # Backend Service
    - id: backendService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-backend-service
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-backend-service
            app.kubernetes.io/component: backend
            app.kubernetes.io/managed-by: kro
          annotations:
            alb.ingress.kubernetes.io/healthcheck-path: /health
        spec:
          type: ClusterIP
          ports:
            - port: ${schema.spec.backendPort}
              targetPort: ${schema.spec.backendPort}
              protocol: TCP
              name: http
          selector:
            app.kubernetes.io/name: ${schema.spec.name}-backend
            app.kubernetes.io/component: backend

    # Frontend Deployment
    - id: frontendDeployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-frontend
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-frontend
            app.kubernetes.io/component: frontend
            app.kubernetes.io/managed-by: kro
        spec:
          replicas: ${schema.spec.frontendReplicas}
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}-frontend
              app.kubernetes.io/component: frontend
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.spec.name}-frontend
                app.kubernetes.io/component: frontend
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 101
                runAsGroup: 101
                seccompProfile:
                  type: RuntimeDefault
              volumes:
                - name: tmp
                  emptyDir: {}
                - name: nginx-cache
                  emptyDir: {}
              containers:
                - name: frontend
                  image: ${schema.spec.frontendImage}
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
                  # nginx writes its pid and temp files even when only serving
                  # static assets, so these two paths must stay writable.
                  volumeMounts:
                    - name: tmp
                      mountPath: /tmp
                    - name: nginx-cache
                      mountPath: /var/cache/nginx
                  ports:
                    - containerPort: ${schema.spec.frontendPort}
                      name: http
                  resources:
                    requests:
                      memory: "32Mi"
                      cpu: "25m"
                    limits:
                      memory: "64Mi"
                      cpu: "50m"
                  livenessProbe:
                    httpGet:
                      path: /
                      port: ${schema.spec.frontendPort}
                    initialDelaySeconds: 10
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /
                      port: ${schema.spec.frontendPort}
                    initialDelaySeconds: 5
                    periodSeconds: 10

    # Frontend Service
    - id: frontendService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-frontend-service
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-frontend-service
            app.kubernetes.io/component: frontend
            app.kubernetes.io/managed-by: kro
        spec:
          type: ClusterIP
          ports:
            - port: ${schema.spec.frontendServicePort}
              targetPort: ${schema.spec.frontendPort}
              protocol: TCP
              name: http
          selector:
            app.kubernetes.io/name: ${schema.spec.name}-frontend
            app.kubernetes.io/component: frontend

    # Ingress
    - id: ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${schema.spec.name}-ingress
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-ingress
            app.kubernetes.io/managed-by: kro
          annotations:
            # `scheme` is NOT set here: EKS Auto Mode takes it from the
            # IngressClassParams referenced by the IngressClass (see
            # kubernetes/auto-mode-ingressclass.yaml). The remaining
            # per-Ingress annotations are still honoured by Auto Mode.
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/healthcheck-path: /health
            alb.ingress.kubernetes.io/backend-protocol: HTTP
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
            alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600
        spec:
          ingressClassName: ${schema.spec.ingressClass}
          rules:
            - http:
                paths:
                  - path: /game/
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.spec.name}-backend-service
                        port:
                          number: ${schema.spec.backendPort}
                  - path: /leaderboard/
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.spec.name}-backend-service
                        port:
                          number: ${schema.spec.backendPort}
                  - path: /health
                    pathType: Exact
                    backend:
                      service:
                        name: ${schema.spec.name}-backend-service
                        port:
                          number: ${schema.spec.backendPort}
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.spec.name}-frontend-service
                        port:
                          number: ${schema.spec.frontendServicePort}
