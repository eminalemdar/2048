apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: dynamodb-table
  namespace: kro
spec:
  schema:
    apiVersion: v1alpha1
    kind: DynamoDBTable
    spec:
      # Table configuration
      tableName: string | default="game2048-leaderboard"
      region: string | default="eu-west-1"
      billingMode: string | default="PAY_PER_REQUEST"

    # Status fields must be CEL expressions naming where the value comes from.
    # A bare type (`tableArn: string`) is rejected by kro with
    # "status fields without expressions are not supported".
    status:
      tableArn: ${dynamodbTable.status.ackResourceMetadata.arn}
      tableStatus: ${dynamodbTable.status.tableStatus}

  resources:
    # DynamoDB Table using ACK DynamoDB Controller
    - id: dynamodbTable
      template:
        apiVersion: dynamodb.services.k8s.aws/v1alpha1
        kind: Table
        metadata:
          name: ${schema.spec.tableName}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/name: ${schema.spec.tableName}
            app.kubernetes.io/managed-by: kro
        spec:
          tableName: ${schema.spec.tableName}
          keySchema:
            - attributeName: id
              keyType: HASH
          attributeDefinitions:
            - attributeName: id
              attributeType: "S"
            - attributeName: leaderboard
              attributeType: "S"
            - attributeName: score
              attributeType: "N"
          globalSecondaryIndexes:
            # ⚠️  Changing the key schema of an existing GSI is not possible in
            # DynamoDB — UpdateTable rejects it with:
            #   "The only Updates for index: ScoreIndex when TableThroughputMode
            #    is PAY_PER_REQUEST can be to OnDemandThroughput, WarmThroughput"
            # Upgrading a table created before this change therefore requires
            # deleting and recreating the index (or the table). Back the data up
            # first — the S3 snapshot written by the backend is one way to do it.
            #
            # Ranked reads of the leaderboard.
            #
            # `leaderboard` is a constant partition key ("global") written on
            # every entry, with `score` as the sort key. DynamoDB Query needs an
            # equality condition on the partition key, so the previous schema —
            # score as HASH, timestamp as RANGE — could not answer "top N by
            # score" at all, which is why the code fell back to a full Scan.
            - indexName: ScoreIndex
              keySchema:
                - attributeName: leaderboard
                  keyType: HASH
                - attributeName: score
                  keyType: RANGE
              projection:
                projectionType: ALL
          billingMode: ${schema.spec.billingMode}
          tags:
            - key: Project
              value: game2048
            - key: ManagedBy
              value: KRO
            - key: Region
              value: ${schema.spec.region}
