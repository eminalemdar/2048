apiVersion: kro.run/v1alpha1
kind: Game2048Application
metadata:
  name: game2048-dev
  namespace: kro
spec:
  name: "game2048"
  namespace: "game-2048"
  backendImage: "emnalmdr/2048-backend:v8"
  backendReplicas: 2
  backendPort: 8000
  frontendImage: "emnalmdr/2048-frontend:v8"
  frontendReplicas: 2
  # Container port (unprivileged nginx); the Service still listens on 80.
  frontendPort: 8080
  frontendServicePort: 80
  tableName: "game2048-leaderboard-dev"
  sessionsTableName: "game2048-sessions-dev"
  region: "eu-west-1"
  # Filled in by scripts/deploy_kro_application.sh from the target AWS account.
  accountId: "__AWS_ACCOUNT_ID__"
  backendRoleName: "game2048-backend-role"
  hostname: "2048.local"
  ingressClass: "alb"