apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: game-2048
  labels:
    app: 2048-frontend
    component: frontend
spec:
  type: ClusterIP
  ports:
  # Callers still use 80; the pod serves on 8080 because it runs unprivileged.
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: 2048-frontend
    component: frontend