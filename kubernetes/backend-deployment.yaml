apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: game-2048
  labels:
    app: 2048-backend
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 2048-backend
      component: backend
  template:
    metadata:
      labels:
        app: 2048-backend
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        # Registry image: these manifests target EKS Auto Mode's ALB, so the
        # nodes must be able to pull. A local `2048-backend:latest` tag is not
        # resolvable on EKS. Rebuild with scripts/build_and_push.sh and bump.
        image: emnalmdr/2048-backend:v9
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          # The Go binary is static and writes nothing to disk.
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: AWS_REGION
          value: "us-east-1"
        - name: DYNAMODB_TABLE
          value: "game2048-leaderboard"
        # Uncomment below for S3 support
        # - name: S3_BUCKET
        #   value: "your-2048-game-bucket"
        # AWS credentials should be provided via IAM roles or service accounts
        # For development, you can use AWS credentials as secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always