apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: game-2048
  labels:
    app: 2048-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 2048-frontend
      component: frontend
  template:
    metadata:
      labels:
        app: 2048-frontend
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        # Registry image: these manifests target EKS Auto Mode's ALB, so the
        # nodes must be able to pull. A local `2048-frontend:latest` tag is not
        # resolvable on EKS. Rebuild with scripts/build_and_push.sh and bump.
        image: emnalmdr/2048-frontend:v8
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        # 8080: the unprivileged nginx image cannot bind port 80.
        - containerPort: 8080
          name: http
        # nginx needs these paths writable even when only serving static
        # files; the rest of the filesystem stays read-only.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      restartPolicy: Always