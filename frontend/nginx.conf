server {
    # 8080, not 80: the container runs unprivileged and cannot bind a
    # port below 1024. The Service/ALB still expose this on 80.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # `always` matters: without it nginx omits these on error responses (4xx/5xx),
    # which includes the SPA fallback below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Content-Security-Policy.
    #
    # The Vite build emits only external JS/CSS — no inline <script> or <style>
    # blocks — so this needs neither 'unsafe-inline' nor a nonce. If you ever add
    # an inline script, this policy will block it; add a hash rather than
    # loosening the directive.
    #
    # connect-src also allows http://localhost:8000 because the SAME image serves
    # both deployments: under docker-compose the app is on :3000 and the API on
    # :8000 (a different origin), while on EKS the ALB serves both from one origin
    # and 'self' covers it. Drop the localhost entry to harden a
    # production-only image.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Serve static files and handle client-side routing
    location / {
        try_files $uri /index.html;
    }

    # Remove proxy configuration - ALB handles API routing
    error_page 404 /index.html;
}