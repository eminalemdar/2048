server {
    # 8080, not 80: the container runs unprivileged and cannot bind a
    # port below 1024. The Service/ALB still expose this on 80.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and handle client-side routing
    location / {
        try_files $uri /index.html;
    }

    # Remove proxy configuration - ALB handles API routing
    error_page 404 /index.html;
}